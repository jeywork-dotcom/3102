    type: vless
    server: 104.17.0.3
    port: 443
    uuid: ddaf7e96-2b0b-4934-8e04-1aab57ac06b9
    network: ws
    tls: true
    udp: true
    packet-encoding: xudp
    servername: jeypan.pages.dev
    client-fingerprint: chrome
    ws-opts:
      path: "/"
